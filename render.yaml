services:
  - type: web
    name: jobpilot
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # Deploy-button users opt in to updates manually instead of receiving every
    # future commit from the source repository automatically.
    autoDeployTrigger: off
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobpilot-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MODEL_CONFIG_ENCRYPTION_KEY
        generateValue: true
      - key: KNOWLEDGE_ADMIN_KEY
        sync: false
      - key: EMBEDDING_API_KEY
        sync: false
      - key: EMBEDDING_BASE_URL
        value: https://api.openai.com/v1
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIMENSION
        value: "1536"
      - key: LOCAL_WORKSPACE_MODE
        value: "false"
      - key: ANONYMOUS_WORKSPACE_MODE
        value: "true"
      - key: WORKSPACE_COOKIE_SECURE
        value: "true"
      - key: WORKSPACE_TTL_DAYS
        value: "30"
      - key: TASK_MODE
        value: thread
      - key: SERVE_FRONTEND
        value: "true"
      - key: MAX_UPLOAD_MB
        value: "8"

databases:
  - name: jobpilot-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: jobpilot
    user: jobpilot
